[package]
name = "fsearch"
version = "0.1.0"
edition = "2021"
description = "Lightning-fast file and content search for Windows"

[dependencies]
ignore = "0.4"
memmap2 = "0.9"
memchr = "2"
regex = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
rayon = "1.10"
crossbeam-channel = "0.5"
wry = "0.47"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
